<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="matrix-title matrix-desc">
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { fill: #f5f5f7; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #a3a3b0; font-size: 14px; }
    .label { fill: #f5f5f7; font-size: 15px; font-weight: 600; }
    .muted { fill: #a3a3b0; font-size: 13px; }
    .value { fill: #f5f5f7; font-size: 16px; font-weight: 700; }
  </style>
  <rect width="960" height="520" rx="28" fill="#15151b"/>

  <title id="matrix-title">Confusion matrix at threshold 0.5</title>
  <desc id="matrix-desc">At threshold 0.5 the model produces 85,206 true negatives, 292 false positives, 1,706 false negatives, and 1,377 true positives.</desc>
  <text x="44" y="52" class="title">Confusion matrix</text>
  <text x="44" y="80" class="subtitle">Threshold 0.5</text>

  <text x="401" y="126" class="muted" text-anchor="middle">PREDICTED LEGITIMATE</text>
  <text x="651" y="126" class="muted" text-anchor="middle">PREDICTED FRAUD</text>
  <text x="250" y="223" class="muted" text-anchor="end">ACTUAL LEGITIMATE</text>
  <text x="250" y="373" class="muted" text-anchor="end">ACTUAL FRAUD</text>

  <rect x="282" y="150" width="238" height="138" rx="20" fill="#6cb7ff" opacity="0.78"/>
  <text x="401" y="220" fill="#f5f5f7" font-size="35" font-weight="750" text-anchor="middle">85,206</text>
  <text x="401" y="250" fill="#f5f5f7" font-size="12" opacity="0.78" text-anchor="middle">TRUE NEGATIVE</text>

  <rect x="532" y="150" width="238" height="138" rx="20" fill="#ffb85c" opacity="0.42"/>
  <text x="651" y="220" fill="#f5f5f7" font-size="35" font-weight="750" text-anchor="middle">292</text>
  <text x="651" y="250" fill="#f5f5f7" font-size="12" opacity="0.78" text-anchor="middle">FALSE POSITIVE</text>

  <rect x="282" y="300" width="238" height="138" rx="20" fill="#9b8cff" opacity="0.48"/>
  <text x="401" y="370" fill="#f5f5f7" font-size="35" font-weight="750" text-anchor="middle">1,706</text>
  <text x="401" y="400" fill="#f5f5f7" font-size="12" opacity="0.78" text-anchor="middle">FALSE NEGATIVE</text>

  <rect x="532" y="300" width="238" height="138" rx="20" fill="#ff6bcb" opacity="0.78"/>
  <text x="651" y="370" fill="#f5f5f7" font-size="35" font-weight="750" text-anchor="middle">1,377</text>
  <text x="651" y="400" fill="#f5f5f7" font-size="12" opacity="0.78" text-anchor="middle">TRUE POSITIVE</text>

</svg>
